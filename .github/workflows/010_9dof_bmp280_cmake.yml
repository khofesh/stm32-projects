name: 010_9dof_bmp280_cmake

on:
  push:
    paths:
      - "stm32f3disc/010_9dof_bmp280_cmake/**"
      - ".github/workflows/010_9dof_bmp280_cmake.yml"
  pull_request:
    paths:
      - "stm32f3disc/010_9dof_bmp280_cmake/**"
      - ".github/workflows/010_9dof_bmp280_cmake.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 010_9dof_bmp280_cmake-${{ github.ref }}
  cancel-in-progress: true

env:
  ARM_TOOLCHAIN: 15.2.rel1
  ARM_TOOLCHAIN_SHA256: 597893282ac8c6ab1a4073977f2362990184599643b4c5ee34870a8215783a16
  ARM_TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
  PROJECT: stm32f3disc/010_9dof_bmp280_cmake
  CLANG_FORMAT_VERSION: 23.1.5

defaults:
  run:
    working-directory: stm32f3disc/010_9dof_bmp280_cmake

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cppcheck ninja-build python3
          pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Arm GNU toolchain cache
        id: arm-cache
        uses: actions/cache@v4
        with:
          path: ~/arm-none-eabi
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN }}-${{ env.ARM_TOOLCHAIN_SHA256 }}

      - name: Arm GNU toolchain (pinned)
        if: steps.arm-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "${ARM_TOOLCHAIN_URL}" -o /tmp/arm-toolchain.tar.xz
          echo "${ARM_TOOLCHAIN_SHA256}  /tmp/arm-toolchain.tar.xz" | sha256sum -c -
          mkdir -p ~/arm-none-eabi
          tar -xJf /tmp/arm-toolchain.tar.xz -C ~/arm-none-eabi --strip-components=1

      - name: Arm GNU toolchain on PATH
        run: echo "${HOME}/arm-none-eabi/bin" >> "${GITHUB_PATH}"

      - name: Build (ci, -Werror)
        run: |
          cmake --preset ci -DCLANG_FORMAT_EXECUTABLE="$(pipx environment --value PIPX_BIN_DIR)/clang-format"
          cmake --build --preset ci

      - name: Host tests
        run: |
          cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/tests
          ctest --test-dir build/tests --output-on-failure

      - name: clang-format
        run: cmake --build --preset ci --target format-check

      - name: cppcheck
        run: cmake --build --preset ci --target cppcheck

      - uses: actions/upload-artifact@v4
        with:
          name: 010_9dof_bmp280_cmake
          path: |
            stm32f3disc/010_9dof_bmp280_cmake/build/ci/010_9dof_bmp280_cmake.elf
            stm32f3disc/010_9dof_bmp280_cmake/build/ci/010_9dof_bmp280_cmake.hex
            stm32f3disc/010_9dof_bmp280_cmake/build/ci/010_9dof_bmp280_cmake.bin
            stm32f3disc/010_9dof_bmp280_cmake/build/ci/010_9dof_bmp280_cmake.map
          if-no-files-found: error

  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build python3

      - name: Arm GNU toolchain cache
        id: arm-cache
        uses: actions/cache@v4
        with:
          path: ~/arm-none-eabi
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN }}-${{ env.ARM_TOOLCHAIN_SHA256 }}

      - name: Arm GNU toolchain (pinned)
        if: steps.arm-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "${ARM_TOOLCHAIN_URL}" -o /tmp/arm-toolchain.tar.xz
          echo "${ARM_TOOLCHAIN_SHA256}  /tmp/arm-toolchain.tar.xz" | sha256sum -c -
          mkdir -p ~/arm-none-eabi
          tar -xJf /tmp/arm-toolchain.tar.xz -C ~/arm-none-eabi --strip-components=1

      - name: Arm GNU toolchain on PATH
        run: echo "${HOME}/arm-none-eabi/bin" >> "${GITHUB_PATH}"

      - name: Two clean builds, compare checksums
        run: bash tools/repro_check.sh
